name: Google giriş ve JWT güvenliği
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  kimlik-testleri:
    name: Gerçek PostgreSQL ve imza doğrulama
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kurgusal-test-parolasi
          POSTGRES_DB: codex_aipattern_auth_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d codex_aipattern_auth_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Gerçek uygulama paketlerini kur
        run: python -m pip install -r backend/requirements.txt
      - name: Bağımlılık tutarlılığını denetle
        run: python -m pip check
      - name: Dış ağı kapalı kimlik, HTTP, WebSocket, geçiş ve kalibrasyon testleri
        env:
          AIPATTERN_TEST_DATABASE_URL: postgresql://postgres:kurgusal-test-parolasi@127.0.0.1:5432/codex_aipattern_auth_ci
        run: python backend/scripts/test-auth-security.py
