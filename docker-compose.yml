version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: patternweb_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-patternweb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-patternweb}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: patternweb_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patternweb_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-patternweb}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-patternweb}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - VERTEX_API_KEY=${VERTEX_API_KEY}
      - VERTEX_MODEL=${VERTEX_MODEL:-gemini-3.5-flash}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    container_name: patternweb_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
      - PORT=3000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
